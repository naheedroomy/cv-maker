# docker-compose.prod.yml — Production deployment on VPS
# Images are pre-built and pushed to GHCR by GitHub Actions.
# The .env file must exist on the VPS at /opt/cv-maker/.env with production secrets.
#
# Usage on VPS:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --remove-orphans

services:
  backend:
    image: ghcr.io/naheedroomy/cv-maker-backend:latest
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - CV_MAKER_DB_PATH=/app/data/cv_maker.db
      - BASE_CV_PATH=/app/data/base_cv.yaml
      - CORS_ORIGINS=https://resume.xenohass.work
    volumes:
      - cv-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/naheedroomy/cv-maker-frontend:latest
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  cv-data:

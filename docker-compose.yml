services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - CV_MAKER_DB_PATH=/app/data/cv_maker.db
      - BASE_CV_PATH=/app/data/base_cv.yaml
      - CORS_ORIGINS=http://localhost
    volumes:
      - cv-data:/app/data
      - ~/.claude:/home/appuser/.claude:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cv-data:

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - CV_MAKER_DB_PATH=/app/data/cv_maker.db
      - BASE_CV_PATH=/app/data/base_cv.yaml
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
    volumes:
      - cv-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cv-data:

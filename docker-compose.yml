services:
  cv-maker:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist database across restarts
      - cv-data:/app/data
      # PDFs accessible on host at ./output/
      - ./output:/app/output
      # Mount base CV directory — base_cv.yaml is created by the Import CV page
      - ./data:/app/cv-data
      # Mount Claude CLI auth from host (run 'claude login' on host first)
      - ~/.claude:/root/.claude:ro
    environment:
      - CV_MAKER_DB_PATH=/app/data/cv_maker.db
      - BASE_CV_PATH=/app/cv-data/base_cv.yaml

volumes:
  cv-data:

[project]
name = "cv-maker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=0.52.0",
    "fastapi>=0.135.3",
    "fpdf2>=2.8.7",
    "google-auth>=2.40.0",
    "google-genai>=1.70.0",
    "jinja2>=3.1.6",
    "openai>=2.30.0",
    "pydantic>=2.12.5",
    "pymupdf>=1.25.0",
    "python-multipart>=0.0.9",
    "PyJWT>=2.9.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is standard in pytest tests

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

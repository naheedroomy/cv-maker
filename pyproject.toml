[project]
name = "cv-maker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.135.3",
    "jinja2>=3.1.6",
    "pandas>=2.2",
    "pydantic>=2.12.5",
    "pyyaml>=6.0",
    "streamlit>=1.45.0",
    "uvicorn[standard]>=0.43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is standard in pytest tests

[tool.pytest.ini_options]
testpaths = ["tests"]
